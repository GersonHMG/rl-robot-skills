# small_engine settings. Every key is optional (defaults shown).
# Units: metres, seconds, radians.

robot_id = 0
team = "blue"          # "blue" or "yellow"
rate_hz = 60.0
record_dir = "recordings"
screen = true         # debug screen window (robot position, record button)

[vision]
multicast_addr = "224.5.23.2"
port = 10020
interface = "0.0.0.0"  # IP of the network card on the vision network, 0.0.0.0 = default
timeout = 0.3          # robot unseen this long -> commands go to zero
# min_x = 0.0          # only accept detections with min_x <= x <= max_x
# max_x = 0.0

[vision.kalman]        # vx, vy, omega estimate; tune live in the window's Filter panel or with `kf`
enabled = true         # false = raw finite differences
q_pos = 3.0            # acceleration noise, m/s^2: higher follows faster, noisier
r_pos = 0.003          # vision position noise, m: higher is smoother, more lag
q_theta = 20.0         # angular acceleration noise, rad/s^2
r_theta = 0.02         # vision heading noise, rad

[output]
kind = "grsim"         # "serial" (real robot), "grsim" (simulator / fake_robot) or "none"
serial_port = "COM3"
baud_rate = 460800     # Sysmic base station; robot ids 0-5 on serial
grsim_addr = "127.0.0.1:20011"

[control]
max_speed = 1.0
max_accel = 2.0
max_omega = 4.0
max_alpha = 15.0
pos_tolerance = 0.02
angle_tolerance = 0.05
kp_pos = 3.0
kp_angle = 4.0
field_half_length = 4.5   # goals and positions outside are refused; 0 = no limit
field_half_width = 3.0
