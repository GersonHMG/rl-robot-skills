<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>small_engine</title>
<style>
  body { margin: 0; background: #181818; color: #ddd; font: 14px monospace; }
  #bar { height: 36px; padding: 0 10px; display: flex; gap: 16px; align-items: center; }
  canvas { display: block; width: 100vw; height: calc(100vh - 36px); }
</style>
</head>
<body>
<div id="bar"><span id="info">connecting...</span></div>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const info = document.getElementById('info');

function draw(s) {
  const W = c.width = c.clientWidth * devicePixelRatio;
  const H = c.height = c.clientHeight * devicePixelRatio;
  const hl = s.hl || 4.5, hw = s.hw || 3, m = 0.3;
  const k = Math.min(W / (2 * (hl + m)), H / (2 * (hw + m)));   // px per metre
  const X = x => W / 2 + x * k, Y = y => H / 2 - y * k;          // world y up
  const circle = (x, y, r, fill) => { g.beginPath(); g.arc(X(x), Y(y), Math.max(r * k, 3), 0, 7); g.fillStyle = fill; g.fill(); };

  g.fillStyle = '#1e5a28'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#fff'; g.lineWidth = 2;
  g.strokeRect(X(-hl), Y(hw), 2 * hl * k, 2 * hw * k);
  g.beginPath(); g.moveTo(X(0), Y(hw)); g.lineTo(X(0), Y(-hw)); g.stroke();
  g.beginPath(); g.arc(X(0), Y(0), 0.5 * k, 0, 7); g.stroke();

  if (s.target) {
    g.strokeStyle = '#f44'; const t = 0.08;
    g.beginPath();
    g.moveTo(X(s.target.x - t), Y(s.target.y - t)); g.lineTo(X(s.target.x + t), Y(s.target.y + t));
    g.moveTo(X(s.target.x - t), Y(s.target.y + t)); g.lineTo(X(s.target.x + t), Y(s.target.y - t));
    g.stroke();
  }
  if (s.ball) circle(s.ball.x, s.ball.y, 0.0215, '#ff8c00');
  if (s.robot) {
    const r = s.robot;
    circle(r.x, r.y, 0.09, s.team === 'blue' ? '#3a7bff' : '#f5d000');
    g.strokeStyle = '#000'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(X(r.x), Y(r.y));
    g.lineTo(X(r.x + 0.12 * Math.cos(r.theta)), Y(r.y + 0.12 * Math.sin(r.theta))); g.stroke();
  }

  const r = s.robot;
  info.textContent = (r
    ? `robot ${s.id}  x ${r.x.toFixed(3)}  y ${r.y.toFixed(3)}  θ ${r.theta.toFixed(3)}  v (${r.vx.toFixed(2)}, ${r.vy.toFixed(2)}, ${r.omega.toFixed(2)})`
    : `robot ${s.id} not seen`) + `  |  ${s.mode}`;
}

async function poll() {
  try { draw(await (await fetch('/state')).json()); }
  catch (e) { info.textContent = 'engine not running'; }
  setTimeout(poll, 100);
}
poll();
</script>
</body>
</html>
