# A robot with bad wheels. Only the keys here change; the rest comes from
# config.toml.   uv run sim.py --config bad_robot.toml

[robot]
color = ".5 .1 .1"         # reddish shell, to tell it apart in the viewer

[wheels]
gain = [1.0, 0.75, 1.0, 0.9]  # back-left wheel weak, back-right slightly weak
deadband = 1.5             # rad/s (~0.04 m/s at the rim): very slow moves stall.
                           # small_engine (kp_pos 3, 2 cm tolerance) stalls short of goals above ~2.
noise = 0.15               # 15 % speed wobble
noise_time = 0.15
