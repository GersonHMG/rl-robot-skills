# sim settings. Units: metres, seconds, radians, kilograms.
# Values are typical SSL robot estimates; tune them to match the real robot.

robot_id = 0
team = "blue"              # "blue" or "yellow"

[network]
command_addr = "127.0.0.1:20011"   # grSim commands in (small_engine [output] grsim_addr)
vision_addr = "224.5.23.2:10020"   # SSL-Vision packets out (small_engine [vision])
vision_hz = 60.0
vision_noise_pos = 0.0     # std dev added to x, y, m (real vision ~0.002)
vision_noise_theta = 0.0   # std dev added to heading, rad (real vision ~0.01)
command_timeout = 0.5      # no command this long -> wheels stop

[robot]
radius = 0.09              # 180 mm diameter
height = 0.15
color = ".1 .1 .1"        # shell RGB, 0-1
mass = 2.5
# Wheel positions, degrees from the front (x axis), counter-clockwise.
# Front wheels sit wider apart to leave room for the dribbler.
wheel_angles = [57.0, 135.0, 225.0, 303.0]
wheel_radius = 0.027       # 54 mm wheels
wheel_distance = 0.081     # robot centre to wheel contact

[motor]                    # estimates: 50 W brushless, ~3.3:1 gear
max_wheel_speed = 120.0    # rad/s at the wheel (~3.2 m/s rim speed, ~3.9 m/s top forward)
max_wheel_torque = 0.12    # N*m at the wheel; below friction*m*g/4*r, so wheels never slip
friction = 0.8             # tyre/floor static friction coefficient (grip)
kinetic = 0.7              # sliding friction / static, once a wheel slips
response = 0.03            # s, how fast each wheel's speed loop pushes the body
drag = 0.0                 # rolling resistance, N per m/s (the body slows without push)

[wheels]                   # wheel faults; these are perfect wheels (see bad_robot.toml, slip_robot.toml)
gain = [1.0, 1.0, 1.0, 1.0]  # real speed / asked speed, per wheel (worn motor, slipping hub)
deadband = 0.0             # rad/s: asked slower than this, the wheel does not turn (stiction)
noise = 0.0                # wobble: std of the relative speed error (bad rollers, loose wheel)
noise_time = 0.1           # s, how slowly the wobble changes
grip = [1.0, 1.0, 1.0, 1.0]  # tyre grip, per wheel, times [motor] friction (worn tyre < 1)
torque = [1.0, 1.0, 1.0, 1.0]  # motor strength, per wheel, times max_wheel_torque (weak motor < 1)
