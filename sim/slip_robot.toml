# A robot with torque problems: it spins when moving sideways. Only the
# keys here change; the rest comes from config.toml.
#   uv run sim.py --config slip_robot.toml
#
# Moving sideways loads the back wheels most (they point most sideways), and
# rolling drag needs that push the whole time. The weak back motors max out
# and lag (orange in the viewer), the front ones do not, so the robot turns
# as soon as it slides and keeps turning (~2 rad/s). Forward moves load the
# wheels evenly and stay straight.

[robot]
color = ".5 .35 .05"       # amber shell, to tell it apart in the viewer

[motor]
max_wheel_torque = 0.06    # N*m: weak motors (the good robot has 0.12)
friction = 0.5             # worn tyres: hard pushes can still slip (red)
kinetic = 0.6              # a slipping wheel pushes with 60 % of its grip
drag = 3.0                 # N per m/s: omni rollers and carpet resist all the time

[wheels]
torque = [1.0, 0.2, 0.2, 1.0]  # back motors weaker still: 20 %. Raise toward 0.4 for a gentle banana, lower to 0.1 to spin in place
